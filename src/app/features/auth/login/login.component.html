<div class="min-h-screen bg-white flex items-center justify-center px-4">
  <div class="w-full max-w-sm space-y-8">

    <!-- Logo -->
    <div class="text-center space-y-2">
      <span class="text-5xl">🧑‍💼</span>
      <h1 class="text-2xl font-semibold text-slate-900 tracking-tight">RH Seleção</h1>
      <p class="text-sm text-slate-500">Entre na sua conta para continuar.</p>
    </div>

    <!-- Formulário -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5" novalidate>

      <app-campo rotulo="E-mail" tipo="email" placeholder="seu@email.com" [controle]="email" [erros]="[
          { chave: 'required', mensagem: 'Campo obrigatório.' },
          { chave: 'email', mensagem: 'Informe um e-mail válido.' }
        ]" />

      <app-campo rotulo="Senha" tipo="password" placeholder="Mínimo 8 caracteres" [controle]="senha" [erros]="[
          { chave: 'required', mensagem: 'Campo obrigatório.' },
          { chave: 'pattern', mensagem: 'Mínimo 8 caracteres com maiúsculas, minúsculas e número.' }
        ]" />

      <!-- Erro de autenticação Firebase -->
      @if (erroAutenticacao()) {
        <p class="text-red-500 text-[12px] text-center">{{ erroAutenticacao() }}</p>
      }

      <app-botao tipo="submit" rotulo="Entrar" rotuloCarregando="Entrando..." [carregando]="carregando()"
        [desabilitado]="form.invalid" />
    </form>

    <!-- Rodapé -->
    <p class="text-center text-[12px] text-slate-400">
      Não tem conta?
      <a routerLink="/auth/register" class="font-medium text-slate-700 hover:underline">Criar conta</a>
    </p>

  </div>
</div>
