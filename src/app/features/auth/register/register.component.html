<div class="min-h-screen bg-white flex items-center justify-center px-4">
  <div class="w-full max-w-sm space-y-8">

    <!-- Logo -->
    <div class="text-center space-y-2">
      <span class="text-5xl">📋</span>
      <h1 class="text-2xl font-semibold text-slate-900 tracking-tight">Criar Conta</h1>
      <p class="text-sm text-slate-500">Preencha os dados para se cadastrar.</p>
    </div>

    <!-- Formulário -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5" novalidate>

      <app-campo
        rotulo="Nome completo"
        placeholder="João da Silva"
        [controle]="nome"
        [erros]="[
          { chave: 'required', mensagem: 'Campo obrigatório.' },
          { chave: 'minlength', mensagem: 'Mínimo de 3 caracteres.' }
        ]"
      />

      <app-campo
        rotulo="E-mail"
        tipo="email"
        placeholder="seu@email.com"
        [controle]="email"
        [erros]="[
          { chave: 'required', mensagem: 'Campo obrigatório.' },
          { chave: 'email', mensagem: 'Informe um e-mail válido.' }
        ]"
      />

      <app-campo
        rotulo="Senha"
        tipo="password"
        placeholder="Mínimo 8 caracteres"
        [controle]="senha"
        [erros]="[
          { chave: 'required', mensagem: 'Campo obrigatório.' },
          { chave: 'pattern', mensagem: 'Mínimo 8 caracteres com maiúsculas, minúsculas e número.' }
        ]"
      />

      <app-campo
        rotulo="Confirmar senha"
        tipo="password"
        placeholder="Repita a senha"
        [controle]="confirmarSenha"
        [erroExterno]="form.errors"
        [erros]="[
          { chave: 'required', mensagem: 'Campo obrigatório.' },
          { chave: 'senhasNaoConferem', mensagem: 'As senhas não conferem.' }
        ]"
      />

      <app-botao
        tipo="submit"
        rotulo="Criar Conta"
        rotuloCarregando="Criando conta..."
        [carregando]="carregando()"
        [desabilitado]="form.invalid"
      />
    </form>

    <!-- Rodapé -->
    <p class="text-center text-[12px] text-slate-400">
      Já tem conta?
      <a routerLink="/auth/login" class="font-medium text-slate-700 hover:underline">Entrar</a>
    </p>

  </div>
</div>
